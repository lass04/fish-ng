<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
<body style="background-color:#f7f3eb;">

  <div class="position-fixed top-0 end-0 m-3">
  <a [routerLink]="['/']" >
    <button class="btn shadow rounded-pill px-3 py-2" style="background-color:#1E3A8A;color:white;">
      Home
    </button>
    
  </a>
  <a class="btn btn-light shadow rounded-pill px-3 py-2 top-0 end-0 m-3" style="background-color:#1E3A8A;color:white;" [routerLink]="['/auth/signup']">Create Account</a>
</div>
  

  
  <div class="d-flex flex-column justify-content-center align-items-center min-vh-100">

    
    <h1 class="fw-bold mb-4 text-center" style="color:#1E3A8A;">LOGIN</h1>

    
    <form class="border rounded-3 p-4" style="width: 400px; background: rgba(0, 0, 0, 0.5);" #LoginForm="ngForm">
      <div class="mb-3">
        <label for="login" class="form-label fw-bold" style="color:white">Login</label>
        <input id="login" class="form-control form-control-sm" type="text" name="login" [(ngModel)]="credentials[0]" required #username="ngModel">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-bold" style="color:white">Password</label>
        <input id="password" class="form-control form-control-sm" type="password" name="password" minlength="8" required [(ngModel)]="credentials[1]" #password="ngModel">
      </div>

      <div class="border rounded border-dark" style="text-align:center;font-family:Cambria;font-weight:bold;color:#1E3A8A" [hidden]="password.valid || password.pristine">
          Minimum 8 caracters
      </div><br>
      <div class="d-flex justify-content-between align-items-center">
        <button [disabled]="!LoginForm.form.valid" type="submit" class="btn shadow rounded-pill px-3 py-2" style="background-color:#1E3A8A;color:white;" (click)="onSubmit()">Submit</button>
        
      </div>
    </form>
