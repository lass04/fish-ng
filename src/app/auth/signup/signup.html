<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
<body style="background-color: #f7f3eb;">

  <a [routerLink]="['/']" class="position-fixed top-0 end-0 m-3">
    <button class="btn shadow rounded-pill px-3 py-2" style="background-color:#1E3A8A;color:white;">
      Home
    </button>
  </a>

  <div class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <h1 class="fw-bold mb-4 text-center" style="color:#1E3A8A;">SIGN UP</h1>

    <form class="border rounded-3 p-4" style="width: 400px; background: rgba(0, 0, 0, 0.5);">
      <div class="mb-3">
        <label for="login_signup" class="form-label">Login</label>
        <input id="login_signup" class="form-control form-control-sm" type="text" name="Login_signup" required>
      </div>

      <div class="mb-3">
        <label for="password_signup" class="form-label">Password (minimum 8 characters)</label>
        <input id="password_signup" class="form-control form-control-sm" type="password" name="Password_signup" minlength="8" required>
      </div>

      <div class="mb-3">
        <label for="email_signup" class="form-label">Email</label>
        <input id="email_signup" class="form-control form-control-sm" type="email" name="Email_signup" required>
      </div>

      <div class="d-flex justify-content-between align-items-center">
        <button type="submit" class="btn shadow rounded-pill px-3 py-2" style="background-color:#1E3A8A;color:white;">Validate</button>
        <a class="btn btn-light shadow rounded-pill px-3 py-2" [routerLink]="['/auth']">Login Page</a>
      </div>
    </form>
  </div>

</body>
