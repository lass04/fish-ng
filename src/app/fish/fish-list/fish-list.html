<div class="container mt-5">
  <h1 class="text-center text-white fst-italic mb-4" style="color:#1E3A8A;font-family: Cambria;">Fish List for Enthusiasts</h1>

  <a [routerLink]="['/']" class="position-fixed top-0 end-0 m-3">
    <button class="btn btn-light shadow rounded-pill px-3 py-2">
      Home
    </button>
  </a>

  <table class="table table-dark table-hover table-striped align-middle shadow-lg rounded-3 overflow-hidden">
    <thead class="table-dark">
      <tr>
        <th scope="col" class="text-white text-center">#</th>
        <th scope="col" class="text-white">Tunisian Name</th>
        <th scope="col" class="text-white">Habitat</th>
        <th scope="col" class="text-white">KG Price</th>
        <th scope="col" class="text-white text-center">Image</th>
      </tr>
    </thead>
    <tbody>
      @for (fish of fishL; track fish.id) {
        <tr>
          <th scope="row" class="text-center text-white">{{ fish.id }}</th>
          <td class="text-white">{{ fish.tunisian_name }}</td>
          <td class="text-white">{{ fish.habitat }}</td>
          <td class="text-white">{{ fish.piece_price }}</td>
          <td class="text-center">
            <img
              [src]="DisplayImage(fish.id)"
              alt="fish image"
              class="rounded shadow-sm"
              style="width: 220px; height: 90px; object-fit: cover;"
            />
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
