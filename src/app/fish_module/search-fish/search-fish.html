<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<h1 class="center" style="color:#1E3A8A;font-family:Cambria;margin-top: 100px;">Search a Fish</h1>
<div class="container" style="margin-top: 100px;">
    <input class="border" style="color:#1E3A8A;" placeholder="Search a Fish" #input (keyup)="search(input.value)">
</div>

<div class="container">
    <div class="collection">
      <a *ngFor="let fish of fishs$ | async"
      (click)="goToDetail(fish)">
      <div>
          {{fish.tunisian_name}}
        </div><br>
      </a>
    </div>
</div>
