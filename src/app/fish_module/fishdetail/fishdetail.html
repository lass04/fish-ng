  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center fw-bold text-primary" [routerLink]="['/']">
      <img 
        src="favicon.jpg" 
        alt="Logo" 
        width="40" 
        height="40" 
        class="d-inline-block align-text-top rounded-circle border border-dark me-2 shadow-sm"
        style="object-fit: cover;"
      >
      <span class="fs-4 fw-bold" style="color: #1E3A8A; letter-spacing: 1px;font-family: Cambria;">FRECHK</span>

    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active fw-bold" aria-current="page" style="font-family: Cambria;font-size: large;" [routerLink]="['/']">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active fw-bold" aria-current="page" style="font-family: Cambria;font-size: large;" [routerLink]="['/fish/List']">FishList</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active fw-bold" aria-current="page" style="font-family: Cambria;font-size: large;" [routerLink]="['/auth']">Login</a>
        </li>
      </ul>

    </div>

<div class="container mt-4">
  <div class="card shadow border border-dark">
    <div class="card-body p-3">
      <div class="row g-2 align-items-center">
        <div class="col-md-6">
          <table class="table table-bordered table-dark table-striped rounded rounded-3 mb-0" style="max-width: 450px;height:300px;">
            <thead>
              <tr>
                <th scope="col">Tunisian Name : </th>
                <th>{{fish?.tunisian_name}}</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row"> Latin Name : </th>
                <td>{{fish?.latin_name}}</td>
              </tr>
              <tr>
                <th scope="row"> Habitat : </th>
                <td>{{fish?.habitat}}</td>
              </tr>
              <tr>
                <th scope="row"> Price : </th>
                <td>{{fish?.piece_price}}</td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div class="col-md-6">
          <img src="{{fish?.picture}}" class="img-fluid rounded rounded-3 mt-3" alt="Fish Image">
        </div>
        <a [routerLink]="['']"> <button class="btn text-white" style="background-color:#1E3A8A;">Go Back</button></a>
      </div>
      
    </div>
    
  </div>
</div>
