<a [routerLink]="['/']" class="position-fixed top-0 end-0 m-3">
    <button class="btn shadow rounded-pill px-3 py-2" style="background-color:#1E3A8A;color:white;">
      Home
    </button>
  </a>

<div class="d-flex justify-content-center mt-3 mb-3">
<form class="border rounded-3 p-4 " style="width: 400px; background: rgba(0, 0, 0, 0.5);" (ngSubmit)="onSubmit()" #fishAddForm="ngForm">
      <div class="mb-3">
        <label class="form-label fw-bold" style="color:#1E3A8A;">Tunisian Name : </label>
        <input class="form-control form-control-sm" type="text" pattern="^[a-zA-Zéçàè]+(?: [a-zA-Zéçàè]+)*$" name="tun_name" required [(ngModel)]="fish.tunisian_name" #tun_name="ngModel">
      </div>
      <div [hidden]="tun_name.valid || tun_name.pristine" class="rounded text-center" style="background-color:#A94442;color:white;">
          Ce champs est requis
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold" style="color:#1E3A8A;">Latin Name : </label>
        <input class="form-control form-control-sm" type="text" name="lat_name"  pattern="^[a-zA-Zéçàè]+(?: [a-zA-Zéçàè]+)*$" required [(ngModel)]="fish.latin_name" #lat_name="ngModel">
      </div>
      <div [hidden]="lat_name.valid || lat_name.pristine" class="rounded text-center" style="background-color:#A94442;color:white;">
          Ce champs est requis
      </div>

      <div class="mb-3">
        <label  class="form-label fw-bold" style="color:#1E3A8A;">Image Url: </label>
        <input  class="form-control form-control-sm" type="text" pattern="^https://[a-zA-Z./]*$" name="url" required [(ngModel)]="fish.picture" #url="ngModel">
      </div>
      <div [hidden]="url.valid || url.pristine" class="rounded text-center" style="background-color:#A94442;color:white;font-weight:bold;">
          Ce champs est requis
      </div>

      <div class="mb-3">
        <label  class="form-label fw-bold" style="color:#1E3A8A;">Habitat : </label>
        <input  class="form-control form-control-sm" type="text" name="habitat" required [(ngModel)]="fish.habitat" #habitat="ngModel">
      </div>
      <div [hidden]="habitat.valid || habitat.pristine" class="rounded text-center" style="background-color:#A94442;color:white;">
          Ce champs est requis
      </div>

      <div class="mb-3">
        <label  class="form-label fw-bold" style="color:#1E3A8A;">Price : </label>
        <input  class="form-control form-control-sm" type="text" name="price" required [(ngModel)]="fish.price" #price="ngModel">
        <div [hidden]="price.valid || price.pristine" class="rounded text-center" style="background-color:#A94442;color:white;">
          Ce champs est requis
      </div>
        <br>
        <label  class="form-label fw-bold" style="color:#1E3A8A;">Price Unity : </label>
        <select [(ngModel)]="fish.unity" #select="ngModel" name="select" class="rounded rounded-pill form-select" required>
            <option value="Piece" >Piece</option>
            <option value="Kg">Kg</option>
            <option value="100g">100g</option>
        </select>
      </div>

      <div [hidden]="!select.pristine" class="rounded text-center" style="background-color:#A94442;color:white;">
          Ce champs est requis
      </div><br>


      <div class="d-flex justify-content-between align-items-center">
        <button type="submit" class="btn shadow rounded-pill px-3 py-2" style="background-color:#1E3A8A;color:white;" 
        [disabled]="!fishAddForm.form.valid">Validate
      </button>
      </div>
    </form>
    </div>
